# Workshop definition combining the project's toolchain and agent tooling.

name: dev
base: ubuntu@26.04
sdks:
  - name: uv
    channel: latest/stable
  - name: opencode
    channel: latest/stable
  - name: skills
    channel: latest/edge

actions:
  build: |
    uv build
  test: |
    uv run pytest --cov=shopkeep --cov-report=term-missing
