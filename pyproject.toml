[project]
name = "shopkeep"
version = "0.1.0"
description = "Helpers to streamline the development workflow with workshop"
readme = "README.md"
authors = [
    { name = "Zachary Raines", email = "zachary.raines@canonical.com" }
]
requires-python = ">=3.14"
dependencies = [
    "platformdirs>=4.11.12",
    "typer>=0.27.2",
]

[project.scripts]
shopkeep = "shopkeep:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.15",
    "ty>=0.0.49",
]

[tool.pytest.ini_options]
markers = [
    "integration: exercises a real Workshop; skipped unless --run-integration is passed",
]

[tool.coverage.run]
branch = true
source = ["shopkeep"]
